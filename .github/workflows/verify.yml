name: Verify and rebuild
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '25 6 * * 1'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python run.py
      - uses: actions/upload-artifact@v4
        with:
          name: analysis-results
          path: build/
          retention-days: 14
